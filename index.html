<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ذاكرة الفراعنة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(#3b2a14,#120b04);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#fff;touch-action:manipulation}
#top{position:fixed;top:0;left:0;right:0;padding:14px;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
#msg{position:fixed;top:70px;left:0;right:0;text-align:center;font-size:24px;font-weight:700;min-height:34px;color:#ffd166}
#pad{position:fixed;left:50%;top:50%;transform:translate(-50%,-45%);display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(86vw,52vh,380px);aspect-ratio:1}
.p{border:0;border-radius:22px;font-size:48px;opacity:.55;transition:opacity .08s,transform .08s,filter .08s;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}
.p.on{opacity:1;transform:scale(1.06);filter:brightness(1.5)}
#b0{background:#e63946}#b1{background:#2a9d8f}#b2{background:#f4a261}#b3{background:#457b9d}
.ov{position:fixed;inset:0;background:rgba(18,11,4,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:5}
.hide{display:none}
h1{font-size:38px;margin:0;color:#ffd166}
p{margin:0;opacity:.88;line-height:1.7;max-width:320px}
.bt{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:14px;padding:12px 30px;color:#fff;background:linear-gradient(135deg,#e8871e,#b5451b)}
#snd{font-size:16px;padding:4px 10px;background:#ffffff22;border:0;border-radius:10px;color:#fff}
</style></head><body>
<div id="top"><span id="lv">الجولة 0</span><span id="hr">❤️❤️❤️</span><button id="snd">🔊</button></div>
<div id="msg"></div>
<div id="pad"><button class="p" id="b0">🔺</button><button class="p" id="b1">🐍</button><button class="p" id="b2">☀️</button><button class="p" id="b3">👁️</button></div>
<div class="ov" id="menu"><h1>ذاكرة الفراعنة 🔺</h1><p>الكهنة هيضيّئوا الأزرار بترتيب. افتكر الترتيب وكرره بالظبط! كل جولة بتزود خطوة وبتسرّع.</p><p>عندك 3 قلوب ❤️ وكل غلطة بتخسّرك واحد. 5 جولات ورا بعض من غير غلط = قلب جديد.</p><p id="bst"></p><button class="bt" id="go">ابدأ</button></div>
<div class="ov hide" id="over"><h1>خلصت الفرص!</h1><p id="res"></p><button class="bt" id="again">تاني</button></div>
<script>
const SV='pharaoh_memory_v1';let sv={best:0,snd:1};try{Object.assign(sv,JSON.parse(localStorage.getItem(SV)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(SV,JSON.stringify(sv))}catch(e){}}
let AC=null;const FR=[330,415,523,659];function beep(f,d,t,v){if(!sv.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.value=f;a.gain.value=v||.1;a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const B=[0,1,2,3].map(i=>document.getElementById('b'+i));
let seq=[],pos=0,round=0,lives=3,streak=0,state='idle',gen=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function flash(i,ms){B[i].classList.add('on');beep(FR[i],ms/1000);return wait(ms).then(()=>B[i].classList.remove('on'))}
function hud(){document.getElementById('lv').textContent='الجولة '+round;document.getElementById('hr').textContent='❤️'.repeat(lives)||'💔'}
function say(t){document.getElementById('msg').textContent=t}
async function play(){const my=++gen;state='show';say('بص كويس... 👀');await wait(700);const ms=Math.max(180,520-round*18);
 for(const i of seq){if(my!==gen)return;await flash(i,ms);await wait(ms*.45)}
 if(my!==gen)return;state='input';pos=0;say('دورك! 👆')}
function nextRound(){round++;seq.push(Math.floor(Math.random()*4));hud();play()}
function newGame(){gen++;seq=[];round=0;lives=3;streak=0;document.getElementById('menu').classList.add('hide');document.getElementById('over').classList.add('hide');nextRound()}
function press(i){if(state!=='input')return;B[i].classList.add('on');beep(FR[i],.18);setTimeout(()=>B[i].classList.remove('on'),140);
 if(seq[pos]===i){pos++;if(pos===seq.length){state='wait';streak++;say('برافو! ✅');if(streak%5===0&&lives<5){lives++;say('قلب جديد ❤️');beep(900,.3,'triangle')}setTimeout(nextRound,900)}}
 else{lives--;streak=0;hud();beep(110,.4,'sawtooth');if(lives<=0){state='idle';const sc=round-1;const nb=sc>sv.best;if(nb){sv.best=sc;persist()}say('غلط! ❌');setTimeout(()=>{document.getElementById('res').innerHTML='وصلت لجولة '+round+'<br>حفظت '+Math.max(0,sc)+' خطوة'+(nb?'<br>🏆 رقم قياسي جديد!':'<br>أعلى رقم: '+sv.best);document.getElementById('over').classList.remove('hide')},700)}else{state='wait';say('غلط! ❌ هنعيد التسلسل');setTimeout(play,1100)}}}
B.forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();press(i)}));
addEventListener('keydown',e=>{const k={'1':0,'2':1,'3':2,'4':3}[e.key];if(k!==undefined)press(k)});
document.getElementById('go').onclick=newGame;document.getElementById('again').onclick=newGame;
document.getElementById('snd').onclick=function(){sv.snd=sv.snd?0:1;persist();this.textContent=sv.snd?'🔊':'🔇'};document.getElementById('snd').textContent=sv.snd?'🔊':'🔇';
document.getElementById('bst').textContent=sv.best?'🏆 أعلى رقم: '+sv.best+' خطوة':'';
window.__t={newGame,press,st:()=>({seq,state,round,lives,streak}),setFast:()=>{}};
</script></body></html>
